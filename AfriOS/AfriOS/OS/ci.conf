# AfriOS CI/CD Configuration
# Used by GitHub Actions or local CI systems

[build]
parallel_jobs = auto
timeout_minutes = 60
retry_on_failure = 2

[clang_format]
enabled = true
version = 14
style = file

[cppcheck]
enabled = true
checks = all
suppress_warnings = missingIncludeSystem

[cmake]
min_version = 3.16
generator = Ninja
build_type = Release

[testing]
run_unit_tests = true
run_integration_tests = true
run_performance_tests = false
coverage_threshold = 60

[platforms]
linux_ubuntu = true
macos_latest = true
windows_msvc = false

[artifacts]
save_binaries = true
save_logs = true
retention_days = 30
