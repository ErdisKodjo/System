# AfriOS Unified Build Configuration
# This file defines build settings for the entire AfriOS project

[project]
name = AfriOS
version = 1.0.0
description = Multi-platform Operating System with unified runtime

[build_system]
primary = cmake
secondary = soong  # Android Blueprint equivalent
tertiary = gn      # HarmonyOS GN build system

[platforms]
android = true
linux = true
harmonyos = true
windows = true      # Via Wine
ios = true
macos = true

[architecture]
supported_archs = x86, x86_64, armv7, armv8, arm64

[components]
enable_art = true
enable_dxvk = true
enable_wine_support = true
enable_harmony_compat = true
enable_ios_compat = true

[output]
build_dir = build/
output_android = build/android/
output_linux = build/linux/
output_harmony = build/harmony/
output_windows = build/windows/

[optimization]
enable_jit = true
enable_profile_guided = true
strip_symbols = false

[testing]
run_unit_tests = true
run_integration_tests = true
coverage_enabled = false

[security]
enable_selinux = true
enable_sandboxing = true
enable_code_signing = false
